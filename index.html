<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kuis Interaktif Bilangan Bulat SMP</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --success: #16a34a;
      --success-bg: #dcfce7;
      --danger: #dc2626;
      --danger-bg: #fee2e2;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #1e293b;
      --border: #cbd5e1;
    }

    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      margin: 0;
      padding: 20px;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .quiz-container {
      background: var(--card);
      width: 100%;
      max-width: 650px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .quiz-header {
      background: var(--primary);
      color: white;
      padding: 20px 24px;
    }

    .quiz-header h1 {
      margin: 0 0 6px 0;
      font-size: 1.4rem;
    }

    .quiz-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      opacity: 0.9;
    }

    .progress-bar {
      height: 6px;
      background: #e2e8f0;
      width: 100%;
    }

    .progress-fill {
      height: 100%;
      background: #22c55e;
      width: 0%;
      transition: width 0.3s ease;
    }

    .quiz-body {
      padding: 24px;
    }

    .question-text {
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-btn {
      text-align: left;
      padding: 14px 16px;
      border: 2px solid var(--border);
      border-radius: 10px;
      background: #ffffff;
      font-size: 1rem;
      color: var(--text);
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--primary);
      background: #eff6ff;
    }

    .option-btn:disabled {
      cursor: default;
    }

    .option-btn.correct {
      border-color: var(--success);
      background: var(--success-bg);
      color: #14532d;
      font-weight: 600;
    }

    .option-btn.wrong {
      border-color: var(--danger);
      background: var(--danger-bg);
      color: #7f1d1d;
    }

    .option-label {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #e2e8f0;
      font-weight: bold;
      font-size: 0.9rem;
      flex-shrink: 0;
    }

    .feedback-box {
      margin-top: 20px;
      padding: 14px 16px;
      border-radius: 10px;
      font-size: 0.95rem;
      line-height: 1.5;
      display: none;
    }

    .feedback-box.show {
      display: block;
    }

    .feedback-box.correct {
      background: #f0fdf4;
      border-left: 4px solid var(--success);
      color: #166534;
    }

    .feedback-box.wrong {
      background: #fef2f2;
      border-left: 4px solid var(--danger);
      color: #991b1b;
    }

    .quiz-footer {
      padding: 16px 24px 24px;
      display: flex;
      justify-content: flex-end;
    }

    .btn-next {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: none;
    }

    .btn-next:hover {
      background: var(--primary-hover);
    }

    /* Layar Hasil Akhir */
    .result-screen {
      padding: 32px 24px;
      text-align: center;
      display: none;
    }

    .score-circle {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: #eff6ff;
      border: 6px solid var(--primary);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin: 0 auto 20px;
    }

    .score-number {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--primary);
    }

    .score-label {
      font-size: 0.8rem;
      color: #475569;
      font-weight: 600;
    }

    .btn-restart {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px 28px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 16px;
    }

    .btn-restart:hover {
      background: var(--primary-hover);
    }
  </style>
</head>
<body>

  <div class="quiz-container">
    <!-- Header Kuis -->
    <div class="quiz-header">
      <h1>Kuis Matematika: Bilangan Bulat</h1>
      <div class="quiz-meta">
        <span id="questionCounter">Soal 1 dari 10</span>
        <span id="scoreDisplay">Skor: 0</span>
      </div>
    </div>

    <!-- Bar Progres -->
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <!-- Badan Soal -->
    <div class="quiz-body" id="quizBody">
      <div class="question-text" id="questionText">Memuat soal...</div>
      <div class="options-list" id="optionsList"></div>
      <div class="feedback-box" id="feedbackBox"></div>
    </div>

    <!-- Tombol Lanjut -->
    <div class="quiz-footer" id="quizFooter">
      <button class="btn-next" id="nextBtn" onclick="nextQuestion()">Soal Berikutnya &rarr;</button>
    </div>

    <!-- Layar Hasil Akhir -->
    <div class="result-screen" id="resultScreen">
      <div class="score-circle">
        <span class="score-number" id="finalScore">0</span>
        <span class="score-label">NILAI AKHIR</span>
      </div>
      <h2 id="resultTitle">Kuis Selesai!</h2>
      <p id="resultSummary">Kamu menjawab benar X dari 10 soal.</p>
      <button class="btn-restart" onclick="restartQuiz()">↺ Ulangi Kuis</button>
    </div>
  </div>
