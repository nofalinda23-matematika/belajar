<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kuis Interaktif Materi Bilangan SMP</title>
  <style>
    :root {
      --primary: #0f766e;
      --primary-hover: #115e59;
      --success: #16a34a;
      --success-bg: #dcfce7;
      --danger: #dc2626;
      --danger-bg: #fee2e2;
      --bg: #f0fdfa;
      --card: #ffffff;
      --text: #1e293b;
      --border: #cbd5e1;
    }

    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      margin: 0;
      padding: 20px;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .quiz-container {
      background: var(--card);
      width: 100%;
      max-width: 680px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .quiz-header {
      background: var(--primary);
      color: white;
      padding: 20px 24px;
    }

    .quiz-header h1 {
      margin: 0 0 6px 0;
      font-size: 1.4rem;
    }

    .quiz-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      opacity: 0.95;
    }

    .progress-bar {
      height: 6px;
      background: #e2e8f0;
      width: 100%;
    }

    .progress-fill {
      height: 100%;
      background: #10b981;
      width: 0%;
      transition: width 0.3s ease;
    }

    .quiz-body {
      padding: 24px;
    }

    .topic-badge {
      display: inline-block;
      background: #ccfbf1;
      color: #0f766e;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 12px;
    }

    .question-text {
      font-size: 1.12rem;
      font-weight: 600;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-btn {
      text-align: left;
      padding: 14px 16px;
      border: 2px solid var(--border);
      border-radius: 10px;
      background: #ffffff;
      font-size: 1rem;
      color: var(--text);
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--primary);
      background: #f0fdfa;
    }

    .option-btn:disabled {
      cursor: default;
    }

    .option-btn.correct {
      border-color: var(--success);
      background: var(--success-bg);
      color: #14532d;
      font-weight: 600;
    }

    .option-btn.wrong {
      border-color: var(--danger);
      background: var(--danger-bg);
      color: #7f1d1d;
    }

    .option-label {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #e2e8f0;
      font-weight: bold;
      font-size: 0.9rem;
      flex-shrink: 0;
    }

    .feedback-box {
      margin-top: 20px;
      padding: 14px 16px;
      border-radius: 10px;
      font-size: 0.95rem;
      line-height: 1.5;
      display: none;
    }

    .feedback-box.show {
      display: block;
    }

    .feedback-box.correct {
      background: #f0fdf4;
      border-left: 4px solid var(--success);
      color: #166534;
    }

    .feedback-box.wrong {
      background: #fef2f2;
      border-left: 4px solid var(--danger);
      color: #991b1b;
    }

    .quiz-footer {
      padding: 16px 24px 24px;
      display: flex;
      justify-content: flex-end;
    }

    .btn-next {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: none;
    }

    .btn-next:hover {
      background: var(--primary-hover);
    }

    /* Layar Hasil Akhir */
    .result-screen {
      padding: 32px 24px;
      text-align: center;
      display: none;
    }

    .score-circle {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: #f0fdfa;
      border: 6px solid var(--primary);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin: 0 auto 20px;
    }

    .score-number {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--primary);
    }

    .score-label {
      font-size: 0.8rem;
      color: #475569;
      font-weight: 600;
    }

    .btn-restart {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px 28px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 16px;
    }

    .btn-restart:hover {
      background: var(--primary-hover);
    }
  </style>
</head>
<body>

  <div class="quiz-container">
    <!-- Header Kuis -->
    <div class="quiz-header">
      <h1>Kuis Matematika: Bilangan</h1>
      <div class="quiz-meta">
        <span id="questionCounter">Soal 1 dari 10</span>
        <span id="scoreDisplay">Skor: 0</span>
      </div>
    </div>

    <!-- Bar Progres -->
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <!-- Badan Soal -->
    <div class="quiz-body" id="quizBody">
      <span class="topic-badge" id="topicBadge">Kategori</span>
      <div class="question-text" id="questionText">Memuat soal...</div>
      <div class="options-list" id="optionsList"></div>
      <div class="feedback-box" id="feedbackBox"></div>
    </div>

    <!-- Tombol Lanjut -->
    <div class="quiz-footer" id="quizFooter">
      <button class="btn-next" id="nextBtn" onclick="nextQuestion()">Soal Berikutnya &rarr;</button>
    </div>

    <!-- Layar Hasil Akhir -->
    <div class="result-screen" id="resultScreen">
      <div class="score-circle">
        <span class="score-number" id="finalScore">0</span>
        <span class="score-label">NILAI AKHIR</span>
      </div>
      <h2 id="resultTitle">Kuis Selesai!</h2>
      <p id="resultSummary">Kamu menjawab benar X dari 10 soal.</p>
      <button class="btn-restart" onclick="restartQuiz()">↺ Ulangi Kuis</button>
    </div>
  </div>

  <script>
    const quizData = [
      {
        topic: "Bilangan Bulat",
        question: "Hasil dari -18 + 24 : (-6) × 3 adalah ....",
        options: ["-30", "-6", "-3", "30"],
        answer: 0,
        explanation: "Dahulukan pembagian dan perkalian dari kiri: 24 : (-6) = -4, lalu -4 × 3 = -12. Kemudian -18 + (-12) = -30."
      },
      {
        topic: "Bilangan Pecahan",
        question: "Hasil dari 2/3 + 3/4 - 1/2 adalah ....",

        answer: 1,
        explanation: "Samakan penyebut menjadi 12: (8/12) + (9/12) - (6/12) = 11/12."
      },
      {
        topic: "Perbandingan Bilangan",
        question: "Urutan bilangan berikut dari yang terbesar ke terkecil adalah ....",
        options: [
          "0,65 ; 5/8 ; 60% ; 0,55",

        explanation: "Ubah semua ke desimal: 0,65 = 0,650 | 5/8 = 0,625 | 60% = 0,600 | 0,55 = 0,550. Urutan terbesar ke terkecil: 0,65 ; 5/8 ; 60% ; 0,55."
      },
      {
        topic: "KPK & FPB",
        question: "Lampu A menyala setiap 12 detik, sedangkan lampu B menyala setiap 18 detik. Jika keduanya menyala bersama pada pukul 08.00, pada pukul berapa keduanya akan menyala bersama lagi untuk kedua kalinya?",
        options: ["08.00.24", "08.00.30", "08.00.36", "08.01.12"],
        answer: 2,
        explanation: "Cari KPK dari 12 dan 18. Faktorisasi: 12 = 2² × 3, 18 = 2 × 3². KPK = 2² × 3² = 36 detik. Jadi menyala bersama lagi pukul 08.00.36."
      },
      {
        topic: "Bilangan Berpangkat",
        question: "Nilai dari 2⁵ + 3³ - 5² adalah ....",
        options: ["24", "34", "44", "54"],
        answer: 1,
        explanation: "2⁵ = 32, 3³ = 27, dan 5² = 25. Maka 32 + 27 - 25 = 34."
      },
      {
        topic: "Bilangan Desimal",
        question: "Hasil dari 4,5 × 0,4 + 1,2 adalah ....",
        options: ["1,8", "3,0", "3,2", "19,2"],
        answer: 1,
        explanation: "4,5 × 0,4 = 1,8. Kemudian 1,8 + 1,2 = 3,0."
      },
      {
        topic: "Bilangan Prima",
        question: "Jumlah semua bilangan prima yang terletak di antara 10 dan 25 adalah ....",
        options: ["72", "83", "85", "98"],
        answer: 1,
        explanation: "Bilangan prima antara 10 dan 25 adalah 11, 13, 17, 19, dan 23. Jumlahnya: 11 + 13 + 17 + 19 + 23 = 83."
      },
      {
        topic: "Persen & Pecahan",
        question: "Ibu membeli baju seharga Rp150.000,00 dengan diskon 20%. Uang yang harus dibayarkan Ibu adalah ....",
        options: ["Rp30.000,00", "Rp120.000,00", "Rp130.000,00", "Rp140.000,00"],
        answer: 1,
        explanation: "Besar diskon = 20% × 150.000 = Rp30.000. Harga bayar = 150.000 - 30.000 = Rp120.000,00."
      },
      {
        topic: "Pola Bilangan",
        question: "Dua suku berikutnya dari barisan bilangan 2, 5, 9, 14, 20, ..., ... adalah ....",
        options: ["26, 33", "27, 35", "27, 34", "28, 36"],
        answer: 1,
        explanation: "Pola penambahannya bertingkat: +3, +4, +5, +6. Maka berikutnya +7 (20 + 7 = 27) dan +8 (27 + 8 = 35)."
      },
      {
        topic: "Akar Kuadrat",
        question: "Hasil dari √144 + √81 - √64 adalah ....",
        options: ["11", "13", "15", "29"],
        answer: 1,
        explanation: "√144 = 12, √81 = 9, dan √64 = 8. Maka 12 + 9 - 8 = 13."
      }
    ];

    let currentIndex = 0;
    let score = 0;
    let correctCount = 0;
    const optionLetters = ["A", "B", "C", "D"];
